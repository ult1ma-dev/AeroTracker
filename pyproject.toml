[project]
name = "skypro-aeroplanes-coursework"
version = "0.1.0"
description = "Console application for aircraft data from Nominatim and OpenSky"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "requests>=2.32,<3.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black>=25.1,<27.0",
    "isort>=6.0,<7.0",
    "flake8>=7.0,<8.0",
    "mypy>=1.15,<3.0",
    "types-requests>=2.32,<3.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=5.0,<8.0",
    "pre-commit>=4.0,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=76"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src"]

[tool.coverage.report]
fail_under = 76
precision = 2
show_missing = true

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
files = ["src", "main.py"]
python_version = "3.11"
strict = true
