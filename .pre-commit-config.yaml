minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]
        stages: [pre-commit]
      - id: black
        name: Black
        entry: poetry run black
        language: system
        types: [python]
        stages: [pre-commit]
      - id: flake8
        name: Flake8
        entry: poetry run flake8
        language: system
        types: [python]
        stages: [pre-commit]
      - id: mypy
        name: mypy strict
        entry: poetry run mypy
        language: system
        files: ^(src/.*\.py|main\.py|pyproject\.toml|poetry\.lock)$
        pass_filenames: false
        stages: [pre-commit]
      - id: poetry-check
        name: Poetry configuration and lock
        entry: poetry check --lock
        language: system
        files: ^(pyproject\.toml|poetry\.lock)$
        pass_filenames: false
        stages: [pre-commit]
      - id: pytest
        name: pytest with branch coverage
        entry: poetry run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
